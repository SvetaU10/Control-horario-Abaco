<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Accede al sistema de control horario de Abaco Developments.">
    <meta name="theme-color" content="#0b1020">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Abaco Developments">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <title>Iniciar sesión | Abaco Developments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="logo.css">
    <link rel="stylesheet" href="mobile.css">
</head>
<body>
    <div class="bg-glow bg-glow-one" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-two" aria-hidden="true"></div>

    <main class="login-app">
        <section class="login-card">
            <header class="login-head">
                <span class="brand-logo brand-logo--lg" data-dynamic-logo aria-hidden="true"></span>
                <div>
                    <h1>Registro Jornada laboral</h1>
                    <p>Accede a tu panel de fichaje</p>
                </div>
            </header>

            <form id="login-form" class="login-form" novalidate>
                <div class="field">
                    <label for="username">Usuario</label>
                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        placeholder="Tu usuario"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Tu contraseña"
                        required
                    >
                </div>

                <p class="status" id="status" role="status" aria-live="polite"></p>

                <button type="submit" class="submit-btn">Iniciar sesión</button>
            </form>

  

        </section>
    </main>

    <script src="auth.js?v=4"></script>
    <script src="pwa.js?v=3"></script>
    <script src="logo.js?v=5"></script>
    <script src="login.js?v=4"></script>
</body>
</html>

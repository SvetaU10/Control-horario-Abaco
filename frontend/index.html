<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Sistema sencillo para registrar la entrada y salida de los trabajadores.">
    <meta name="theme-color" content="#0b1020">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Abaco Developments">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <title>Control horario | Abaco Developments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="logo.css">
    <link rel="stylesheet" href="mobile.css">
</head>
<body>
    <div class="bg-glow bg-glow-one" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-two" aria-hidden="true"></div>

    <main class="app">
        <header class="top">
            <div class="brand">
                <span class="brand-logo" data-dynamic-logo aria-hidden="true"></span>
                <span>Abaco Developments</span>
            </div>
            <div class="top-meta">
                <span class="badge">En línea</span>
                <span id="current-date">Hoy</span>
                <button type="button" id="logout-btn" class="ghost-btn">Cerrar sesión</button>
            </div>
        </header>

        <section class="hero">
            <p class="tag">Control horario</p>
            <h1>Ficha tu jornada</h1>
            <p class="session-user">Usuario:<strong id="session-user" aria-live="polite"></strong></p>
        </section>

        <div class="grid">
            <section class="panel clock-panel" aria-labelledby="clock-title">
                <div class="panel-head">
                    <h2 id="clock-title">Reloj</h2>
                    <span class="live-dot" aria-hidden="true"></span>
                </div>
                <div class="clock" id="current-time" aria-live="polite">00:00:00</div>

                <div class="clock-form">
                    <div class="actions">
                        <button type="button" id="btn-entrada" class="btn btn-in">Entrada</button>
                        <button type="button" id="btn-salida" class="btn btn-out">Salida</button>
                    </div>
                </div>

                <p class="status" id="status" role="status" aria-live="polite"></p>
            </section>

            <section class="panel history-panel" aria-labelledby="history-title">
                <div class="panel-head">
                    <h2 id="history-title">Historial</h2>
                    <button id="clear-log" class="ghost-btn" type="button">Limpiar</button>
                </div>
                <ul class="log" id="log"></ul>
            </section>
        </div>
    </main>

    <script src="clock.js?v=3"></script>
    <script src="server-popup.js?v=4"></script>
    <script src="auth.js?v=4"></script>
    <script src="pwa.js?v=3"></script>
    <script src="logo.js?v=5"></script>
    <script src="app.js?v=3"></script>
</body>
</html>
